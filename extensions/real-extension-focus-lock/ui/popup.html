<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 320px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #FFF7F8;
      color: #2A1D22;
      margin: 0;
    }
    h2 {
      margin-top: 0;
      color: #C73A57;
      font-size: 18px;
      text-align: center;
      margin-bottom: 16px;
    }
    .card {
      background: #FFFFFF;
      border: 1.5px solid rgba(232, 77, 114, 0.25);
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    label {
      display: block;
      font-weight: 700;
      font-size: 12px;
      color: #66545B;
    }
    input[type="number"], input[type="text"], input[type="password"] {
      width: 100%;
      box-sizing: border-box;
      padding: 8px;
      border-radius: 8px;
      border: 1.5px solid rgba(232, 77, 114, 0.25);
      background-color: #FFFDFD;
      color: #2A1D22;
      font-size: 13px;
    }
    .checkbox-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 4px;
    }
    .checkbox-row {
      flex-direction: row;
      align-items: center;
      display: flex;
      gap: 8px;
      font-size: 13px;
      font-weight: 600;
    }
    .checkbox-row input {
      accent-color: #C73A57;
      width: 16px;
      height: 16px;
    }
    button {
      width: 100%;
      padding: 10px;
      border-radius: 20px;
      border: none;
      font-weight: 800;
      font-size: 14px;
      cursor: pointer;
      text-align: center;
    }
    button.primary {
      background-color: #C73A57;
      color: #FFFFFF;
    }
    button.secondary {
      background-color: rgba(255, 243, 245, 0.95);
      border: 1.5px solid rgba(232, 77, 114, 0.35);
      color: #C73A57;
    }
    .status-active {
      color: #047857;
      font-weight: 800;
      text-align: center;
      font-size: 15px;
    }
    .status-completed {
      color: #1E3A8A;
      font-weight: 800;
      text-align: center;
      font-size: 15px;
    }
    .timer {
      font-size: 32px;
      font-weight: 800;
      text-align: center;
      color: #C73A57;
      margin: 8px 0;
    }
    .blocked-list {
      font-size: 12px;
      color: #66545B;
      text-align: center;
      max-height: 80px;
      overflow-y: auto;
      padding: 4px;
    }
  </style>
</head>
<body>
  <h2>Focus Lock</h2>

  <!-- 0. Login View -->
  <div id="login-view" style="display: none;">
    <div class="card">
      <label for="email">Email Address</label>
      <input type="text" id="email" placeholder="e.g., user@example.com">
      
      <label for="password">Password</label>
      <input type="password" id="password" placeholder="••••••••">
    </div>
    <button id="login-btn" class="primary">Sign In</button>
  </div>

  <!-- 1. Idle View -->
  <div id="idle-view" style="display: none;">
    <div class="card">
      <label for="duration">Duration (Minutes)</label>
      <input type="number" id="duration" value="50" min="1">
      
      <label>Categories to Block</label>
      <div class="checkbox-group">
        <label class="checkbox-row">
          <input type="checkbox" name="category" checked value="social">
          Social Media
        </label>
        <label class="checkbox-row">
          <input type="checkbox" name="category" checked value="video">
          Video & Streaming
        </label>
        <label class="checkbox-row">
          <input type="checkbox" name="category" value="gaming">
          Gaming
        </label>
        <label class="checkbox-row">
          <input type="checkbox" name="category" value="shopping">
          Shopping
        </label>
        <label class="checkbox-row">
          <input type="checkbox" name="category" value="news">
          News
        </label>
      </div>

      <label for="custom-domains">Custom Blocked Domains (comma separated)</label>
      <input type="text" id="custom-domains" placeholder="e.g., example.com, test.org">
    </div>
    <button id="start-btn" class="primary">Start Focus Session</button>
  </div>

  <!-- 2. Active View -->
  <div id="active-view" style="display: none;">
    <div class="card">
      <div class="status-active">🔒 FOCUS ACTIVE</div>
      <div id="timer-display" class="timer">50:00</div>
      <div class="blocked-list" id="blocked-list-desc"></div>
    </div>
    <button id="stop-btn" class="secondary">Stop Session</button>
  </div>

  <!-- 3. Completed View -->
  <div id="completed-view" style="display: none;">
    <div class="card">
      <div class="status-completed">✅ SESSION COMPLETE</div>
      <div class="timer">00:00</div>
    </div>
    <button id="restart-btn" class="primary">Start New Session</button>
  </div>

  <!-- 4. Auth Footer -->
  <div id="auth-footer" style="display: none; text-align: center; margin-top: 12px;">
    <span id="user-display" style="font-size: 11px; color: #66545B;"></span>
    <a href="#" id="signout-link" style="font-size: 11px; color: #C73A57; margin-left: 8px; font-weight: 700; text-decoration: none;">Sign Out</a>
  </div>

  <script src="../dist/ui/popup.js"></script>
</body>
</html>
